<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-sm-10 col-md-7 col-lg-5">
            <div class="card rounded-4">
                <div class="card-body p-4 p-md-5">
                    <p class="text-primary fw-semibold mb-1">BIENVENIDO DE NUEVO</p>
                    <h1 class="h2 fw-bold mb-4">Inicia sesión</h1>
                    <form (ngSubmit)="loginUsuario()">
                        <div class="mb-3">
                            <label for="email" class="form-label">Correo electrónico</label>
                            <input id="email" type="email" name="email" [(ngModel)]="email"
                                class="form-control form-control-lg" required autocomplete="username">
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label">Contraseña</label>
                            <input id="password" type="password" name="password" [(ngModel)]="password"
                                class="form-control form-control-lg" required autocomplete="current-password">
                        </div>
                        <button class="btn btn-primary btn-lg w-100" type="submit" [disabled]="cargando">
                            {{ cargando ? 'Iniciando sesión...' : 'Iniciar sesión' }}
                        </button>
                    </form>
                    <div *ngIf="mensaje" class="alert alert-danger mt-4 mb-0" role="alert">{{ mensaje }}</div>
                </div>
            </div>
        </div>
    </div>
</div>
